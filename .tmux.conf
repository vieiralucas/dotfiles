# Tell tmux to use 24-bit color and respect the terminal's true background
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'

# status bar
set -g status-style fg='#4c4c4c',bg='#cfc1ba'  # soft fg on zenbones base

# status left: current mode indicator (e.g. copy-mode)
set -g status-left ' #[fg=#4c4c4c] '

# status right: session name, date, time
set -g status-right '#[fg=#4c4c4c] [#S] [%d/%m] [%I:%M%p] '

# window list
set -g window-status-format '#I:#W'

# current window
set -g window-status-current-format ' #I:#W* '
set -g window-status-current-style fg='#cfc1ba',bg='#286486',bold  # invert base/bg

# inactive windows
set -g window-status-style fg='#4c4c4c',bg='#cfc1ba'

# pane borders
set -g pane-border-style fg='#e0d8cc'
set -g pane-active-border-style fg='#7c6f64'

# message (command prompt etc.)
set -g message-style fg='#4c4c4c',bg='#cfc1ba'

# display-panes overlay numbers
set -g display-panes-colour '#d5c4a1'           # mid-gray
set -g display-panes-active-colour '#4c4c4c'    # dark gray

# clock mode
set -g clock-mode-colour '#7c6f64'

# copy/resize mode
set -g mode-style fg='#cfc1ba',bg='#4c4c4c'

set -g history-limit 20000

set -g focus-events on
set -a terminal-features echoscreen-256color

# automatically renumber tmux windows
set -g renumber-windows on

# start counting from 1, so it's easier to navigate
set -g base-index 1
setw -g pane-base-index 1

# unbind default prefix and set it to Ctrl+a
unbind C-b
set -g prefix C-a

# for nested tmux sessions
bind-key C-a send-prefix

setw -g aggressive-resize on

set -sg escape-time 0

# vim binds to navigate panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# refresh config file
bind r source-file ~/.tmux.conf

# vim binds for resizing panes
bind C-j resize-pane -D 3
bind C-k resize-pane -U 3
bind C-l resize-pane -R 3
bind C-h resize-pane -L 3

# open stuff at the current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# disable mouse
setw -g mouse off

# vi mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
